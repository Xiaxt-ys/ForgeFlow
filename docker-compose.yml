services:
  mysql:
    image: mysql:8.0
    container_name: forgeflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forgeflow
    ports:
      - "3306:3306"
    volumes:
      - forgeflow-mysql:/var/lib/mysql

  redis:
    image: redis:7
    container_name: forgeflow-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: forgeflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: forgeflow-qdrant
    ports:
      - "6333:6333"
    volumes:
      - forgeflow-qdrant:/qdrant/storage

volumes:
  forgeflow-mysql:
  forgeflow-qdrant:
